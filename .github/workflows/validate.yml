name: Validate skills (Windows only)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline
        shell: ${{ matrix.shell }}
        run: .\scripts\validate.ps1
      - name: Validate Python entrypoint (Windows only)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: python -B ./scripts/validate.py
