name: Validate skills (Windows only)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\validate.ps1
      - name: Validate with PowerShell 7
        shell: pwsh
        run: .\scripts\validate.ps1
      - name: Validate Python entrypoint (Windows only)
        shell: pwsh
        run: python -B ./scripts/validate.py
